    let db = {};

    let posCart = [];
    let dashboardFilterStatus = 'All';

    function loadDatabase() {
      try {
        const stored = localStorage.getItem(APP_STORAGE_KEY);
        if (stored) {
          db = JSON.parse(stored);
        } else {
          db = JSON.parse(JSON.stringify(DEFAULT_DATA));
          saveDatabase();
        }
      } catch (e) {
        db = JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveDatabase() {
      try {
        localStorage.setItem(APP_STORAGE_KEY, JSON.stringify(db));
      } catch (e) {
        console.error('Failed to persist database:', e);
      }
    }

    function confirmResetData() {
      if (confirm('Are you sure you want to reset all system data back to default sample records?')) {
        db = JSON.parse(JSON.stringify(DEFAULT_DATA));
        saveDatabase();
        showToast('System data reset to initial default state.', 'info');
        switchTab(currentTab);
      }
    }

    function formatPHP(num) {
      return '₱' + (parseFloat(num) || 0).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      
      const toast = document.createElement('div');
      let bgColor = 'bg-slate-900 text-white';
      if (type === 'success') bgColor = 'bg-emerald-800 text-white border-l-4 border-emerald-400';
      if (type === 'danger') bgColor = 'bg-rose-900 text-white border-l-4 border-rose-400';
      if (type === 'info') bgColor = 'bg-blue-900 text-white border-l-4 border-blue-400';

      toast.className = `${bgColor} p-3 rounded-lg shadow-xl text-xs font-medium flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-2 pointer-events-auto`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="text-slate-300 hover:text-white">&times;</button>`;
      
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    function switchTab(tabKey) {
      currentTab = tabKey;
      
      // Update sidebar nav active state
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-navy-800', 'text-white', 'font-bold');
        btn.classList.add('hover:bg-slate-800', 'text-slate-300');
      });

      const activeBtn = document.getElementById(`nav-${tabKey}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-navy-800', 'text-white', 'font-bold');
        activeBtn.classList.remove('hover:bg-slate-800', 'text-slate-300');
      }

      const container = document.getElementById('content-container');
      if (!container) return;

      renderTabContent(tabKey, container);
    }

        case 'pos':
          renderPOS(container);
          break;
        case 'advance_orders':
          renderAdvanceOrders(container);
          break;
        case 'quotations':
          renderQuotations(container);
          break;
        case 'stock_dispatch':
          renderStockDispatch(container);
          break;
        case 'waste':
          renderWaste(container);
          break;
        case 'expenses':
          renderExpenses(container);
          break;
        case 'attendance':
          renderAttendance(container);
          break;
        case 'payroll':
          renderPayroll(container);
          break;
        case 'cash_control':
          renderCashControl(container);
          break;

          break;

    function setDashboardOrderFilter(status) {
      dashboardFilterStatus = status;
      renderDashboard(document.getElementById('content-container'));
    }

    function getFilteredDashboardOrders(orders) {
      const todayStr = new Date().toISOString().substring(0, 10);
      if (dashboardFilterStatus === 'Today') {
        return orders.filter(o => o.deliveryDate.startsWith(todayStr));
      }
      if (dashboardFilterStatus !== 'All') {
        return orders.filter(o => o.status === dashboardFilterStatus);
      }
      return orders;
    }

    function scrollToAdvanceOrdersWidget() {
      const el = document.getElementById('dashboard-advance-orders-section');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
        el.classList.add('ring-2', 'ring-blue-500');
        setTimeout(() => el.classList.remove('ring-2', 'ring-blue-500'), 2000);
      }
    }

    function updateDashboardOrderStatus(ordId, newStatus) {
      if (!newStatus) return;
      const ord = db.advanceOrders.find(o => o.id === ordId);
      if (ord) {
        ord.status = newStatus;
        saveDatabase();
        showToast(`Order ${ordId} status updated to: ${newStatus}`, 'success');
        renderDashboard(document.getElementById('content-container'));
      }
    }

    function exportDashboardSummary() {
      const csvContent = "data:text/csv;charset=utf-8," 
        + "Metric,Value\n"
        + `Location,${db.activeLocation}\n`
        + `Total POS Sales,${db.posSales.reduce((a,b)=>a+b.grandTotal,0)}\n`
        + `Total Expenses,${db.expenses.reduce((a,b)=>a+b.totalAmount,0)}\n`
        + `Advance Bookings Count,${db.advanceOrders.length}\n`;
      
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Panalo_Platter_Summary_${db.activeLocation}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('Dashboard CSV exported successfully!', 'success');
    }

    function addToCart(itemId) {
      const item = db.menuItems.find(m => m.id === itemId);
      if (!item) return;

      const isMOA = db.activeLocation.includes('MOA');
      const itemPrice = isMOA ? item.priceMOA : item.priceBGC;

      const existing = posCart.find(c => c.id === itemId);
      if (existing) {
        existing.qty += 1;
      } else {
        posCart.push({ id: item.id, name: item.name, price: itemPrice, qty: 1 });
      }

      renderPOS(document.getElementById('content-container'));
    }

    function removeFromCart(itemId) {
      posCart = posCart.filter(c => c.id !== itemId);
      renderPOS(document.getElementById('content-container'));
    }

    function clearCart() {
      posCart = [];
      renderPOS(document.getElementById('content-container'));
    }

    function calculateCartTotal() {
      return posCart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    }

    function processCheckout(method) {
      if (posCart.length === 0 || isProcessingPayment) return;
      isProcessingPayment = true;

      const grandTotal = calculateCartTotal();
      const txnId = 'TXN-' + Math.floor(10000 + Math.random() * 90000);
      const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 16);

      const newTxn = {
        id: txnId,
        timestamp: timestamp,
        location: db.activeLocation,
        cashier: db.employees[0].name,
        items: [...posCart],
        subtotal: grandTotal,
        discount: 0,
        grandTotal: grandTotal,
        paymentMethod: method,
        status: 'Completed',
        businessDate: timestamp.split(' ')[0]
      };

      db.posSales.push(newTxn);
      saveDatabase();

      showToast(`Sale #${txnId} processed via ${method}!`, 'success');
      
      // Printable Receipt Modal
      openModal(
        `Official Receipt - ${txnId}`,

      // Request WebCam Stream
      setTimeout(() => {

      }, 300);
    }

    async function initCameraStream() {
      const videoEl = document.getElementById('selfie-video-stream');
      const overlayEl = document.getElementById('camera-loading-overlay');
      if (!videoEl) return;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        currentActiveCameraStream = stream;
        videoEl.srcObject = stream;
        if (overlayEl) overlayEl.classList.add('hidden');
      } catch (err) {
        console.warn('Camera stream access failed or permission denied:', err);
        if (overlayEl) {
          overlayEl.innerHTML = `
            <i class="fa-solid fa-camera-slash text-3xl text-rose-400 mb-2"></i>
            <p class="font-bold text-sm text-rose-300">Camera Access Unavailable</p>
            <p class="text-[11px] text-slate-400 mt-1 max-w-xs">You can use the fallback option below to record timestamped attendance.</p>
          `;
        }
      }
    }

    function closeSelfieCameraModal() {
      stopCameraStream();
      closeModal();
    }

    function stopCameraStream() {
      if (currentActiveCameraStream) {
        currentActiveCameraStream.getTracks().forEach(track => track.stop());
        currentActiveCameraStream = null;
      }
    }

    function captureSelfieAndSubmit(type) {
      const videoEl = document.getElementById('selfie-video-stream');
      const canvasEl = document.getElementById('selfie-capture-canvas');
      let capturedImageData = '';

      if (videoEl && videoEl.srcObject && videoEl.videoWidth > 0) {
        canvasEl.width = videoEl.videoWidth;
        canvasEl.height = videoEl.videoHeight;
        const ctx = canvasEl.getContext('2d');
        ctx.translate(canvasEl.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);
        capturedImageData = canvasEl.toDataURL('image/jpeg', 0.85);
      } else {
        capturedImageData = generateSimulatedSelfieSvg(type);
      }

      stopCameraStream();
      closeModal();
      commitAttendanceRecord(type, capturedImageData);
    }

    function useFallbackSimulatedSelfie(type) {
      stopCameraStream();
      closeModal();
      const svgPhoto = generateSimulatedSelfieSvg(type);
      commitAttendanceRecord(type, svgPhoto);
    }

      const activeEmp = db.employees.find(e => e.id === db.activeUserId) || db.employees[0];

                  <th class="p-3">Role</th>
                  <th class="p-3">Location</th>
                  <th class="p-3">Daily Wage</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${db.employees.map(e => `
                  <tr>
                    <td class="p-3 font-mono font-bold text-slate-800">${e.id}</td>
                    <td class="p-3 font-semibold text-slate-800">${e.name}</td>
                    <td class="p-3 text-slate-600">${e.role}</td>
                    <td class="p-3 text-slate-600">${e.location}</td>
                    <td class="p-3 font-bold text-navy-900">${formatPHP(e.dailyWage)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    window.onload = function() {
      loadDatabase();

      // Update live header clock
      setInterval(() => {
        const clockEl = document.getElementById('header-clock');
        if (clockEl) {
          clockEl.innerText = new Date().toLocaleTimeString('en-US', { hour12: false });
        }
      }, 1000);

      // Default load initial tab
      switchTab('dashboard');
    };
  </script>
</body>
</html>
